# Tier 1 smoke test: a real OpenCart, into which the packaged extension is
# installed exactly as a merchant would install it.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: opencart
    healthcheck:
      # Asserts the DATABASE exists, not merely that the server answers:
      # mariadb reports healthy while its init scripts are still running.
      test: ["CMD-SHELL", "mariadb -uroot -proot -e 'USE opencart' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  opencart:
    build:
      context: .
      args:
        OC_VERSION: 4.1.0.4
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/install/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
